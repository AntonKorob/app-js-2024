<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <title>My calculator</title>
    </head>
    <body>
        <div class="container">
            <div class="header mt-5">
                <button class="btn btn-success" type="button">
                    <a class="text-decoration-none" href="index.html">Домой</a>
                </button>
                <button class="btn btn-success" type="button">
                    <a class="text-decoration-none" href="calculator.html">Калькулятор</a>
                </button>
                <button class="btn btn-success" type="button">
                    <a class="text-decoration-none" href="notes.html">Заметки</a>
                </button>
                <button class="btn btn-success" type="button">
                    <a class="text-decoration-none" class="text-decoration-none"
                        href="clipboard.html">Копирование</a>
                </button>
            </div>
            <div class="d-flex justify-content-end">
                <button id="dark-mode-button">&llhard;</button>
            </div>

            <main class="bg-secondary rounded m-2 p-2 w-50">

                <h1>Calculator</h1>
                <div class="input_gt d-flex justify-content-evenly">

                    <input class="form-control m-2 w-50" type="number"
                        name="num1" id="num1">

                    <input class="form-control m-2 pe-3 w-50" type="number"
                        name="num2" id="num2">
                </div>
                <div class="exm m-4 d-flex justify-content-evenly ">

                    <button class="btn btn-info" id="plus">+</button>
                    <button class="btn btn-info" id="minus">-</button>
                    <button class="btn btn-info" id="increase">*</button>
                    <button class="btn btn-info" id="divide">/</button>
                </div>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button class="btn btn-primary" id="submit"
                        type="button">Result</button>
                    <button class="btn btn-primary"
                        onClick="window.location.reload();"
                        type="button">Refresh Page</button>
                </div>
                <div class="result bg-light rounded mt-4 p-1 ">
                    <p>Result: <span id="result"></span></p>

                </div>
            </main>
        </div>

        <script src="app.js"></script>
        <script src="app2.js"></script>
        <script src="app3.js"></script>
        <script src="app_dark.js"></script>

    </body>
</html>
